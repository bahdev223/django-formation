[project]
name = "django-formation"
version = "0.1.0"
description = "Universal training center management engine for Django"
authors = [{name = "bahdev223"}]
license = {text = "MIT"}
readme = "README.md"
urls = {Homepage = "https://github.com/bahdev223/django-formation", Repository = "https://github.com/bahdev223/django-formation"}
keywords = ["django", "formation", "training", "education", "erp"]
requires-python = ">=3.10"
dependencies = [
    "django>=4.0",
    "djangorestframework>=3.15",
    "django-filters>=23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
