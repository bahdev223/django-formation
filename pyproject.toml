[project]
name = "django-formation"
version = "0.1.0"
description = "Universal training center management engine for Django"
authors = [{name = "bahdev223"}]
license = "MIT"
readme = "README.md"
urls = {Homepage = "https://github.com/bahdev223/django-formation", Repository = "https://github.com/bahdev223/django-formation"}
keywords = ["django", "formation", "training", "education", "erp", "multi-tenant"]
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.1",
    "djangorestframework>=3.15,<4",
    "django-filter>=24,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4",
    "pytest-cov>=5",
    "factory-boy>=3",
    "freezegun>=1.5",
    "django-test-migrations>=1.4",
    "ruff>=0.5",
    "mypy>=1.10",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "pre-commit>=3.7",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"src/django_formation/apps.py" = ["F401"]

[tool.coverage.run]
source = ["django_formation"]
omit = [
    "*/migrations/*",
    "*/admin.py",
    "*/domain/events/formation_events.py",
    "*/domain/services/formation_domain_service.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[[tool.mypy.overrides]]
module = "django_formation.admin"
disable_error_code = ["attr-defined"]
