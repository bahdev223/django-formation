[project]
name = "django-formation"
version = "0.1.0"
description = "Universal training center management engine for Django"
authors = [{name = "bahdev223"}]
license = {text = "MIT"}
readme = "README.md"
urls = {Homepage = "https://github.com/bahdev223/django-formation", Repository = "https://github.com/bahdev223/django-formation"}
keywords = ["django", "formation", "training", "education", "erp", "multi-tenant"]
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<6.1",
    "djangorestframework>=3.15,<4",
    "django-filter>=24,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4",
    "factory-boy>=3",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 140
